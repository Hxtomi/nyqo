<title id="title">Nyqo n1 benchmark comparison</title>
<desc id="description">Scores are percentages; higher is better. Nyqo n1 is shaded. Bold underlined scores mark the best result among five compact models. Qwen 4B is shown separately as a larger-model reference. FINAL is an internal 204-task evaluation; ARC-Easy, IFEval, and MBPP+ use subsets of 594, 210, and 100 tasks.</desc>
